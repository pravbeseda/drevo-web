<div class="header-brand">
    @if (pageBackLink(); as backLink) {
        <ui-icon-button
            class="back-button"
            testId="back-button"
            icon="arrow_back"
            label="К списку"
            [link]="backLink"
        />
    }
    <ui-icon-button
        [class.menu-button--has-back]="!!pageBackLink()"
        testId="hamburger-button"
        icon="menu"
        label="Меню"
        (clicked)="toggleDrawer()"
    />

    @if (isEditingTitle()) {
        <input
            #titleInput
            class="page-title-input"
            type="text"
            aria-label="Название статьи"
            [attr.maxlength]="titleMaxLength"
            [formControl]="titleControl"
            (keydown.enter)="onTitleEnter($event)"
            (keydown.escape)="cancelTitleEdit()"
            (blur)="onTitleBlur()"
            data-testid="page-title-input"
        />
    } @else {
        <div class="page-heading">
            <ui-line-clamp
                class="page-title"
                [class.page-title--editable]="canRename()"
                data-testid="page-title"
                [lines]="pageSubtitle() ? 1 : 2"
                [tooltip]="pageTitle()"
                (click)="onTitleClick()"
            >
                {{ pageTitle() }}
            </ui-line-clamp>
            @if (pageSubtitle(); as subtitle) {
                <span
                    class="page-subtitle"
                    data-testid="page-subtitle"
                >
                    {{ subtitle.prefix }}
                    <a
                        class="page-subtitle__link"
                        data-testid="page-subtitle-link"
                        [routerLink]="subtitle.link"
                    >
                        {{ subtitle.label }}
                    </a>
                </span>
            }
        </div>
    }
</div>

<div class="header-actions">
    <ui-icon-button
        testId="search-button"
        icon="search"
        label="Словник"
        (clicked)="openSearch()"
    />
    <app-font-scale-control></app-font-scale-control>
    <app-theme-toggle></app-theme-toggle>
    <app-account-dropdown></app-account-dropdown>
</div>
