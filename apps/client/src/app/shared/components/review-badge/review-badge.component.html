@if (chips().length > 0 || needsMyVote()) {
    <span
        class="review-badge"
        data-testid="review-badge"
    >
        @for (chip of chips(); track chip.status) {
            <span
                class="review-chip review-chip--{{ chip.statusClass }}"
                data-testid="review-badge-chip"
                [uiTooltip]="chip.tooltip"
            >
                <ui-icon
                    size="small"
                    [name]="chip.icon"
                />
                <span data-testid="review-badge-chip-text">{{ chip.text }}</span>
            </span>
        }
        @if (needsMyVote()) {
            <span
                class="review-pill"
                data-testid="review-badge-vote"
            >
                Нужен ваш голос
            </span>
        }
    </span>
}
