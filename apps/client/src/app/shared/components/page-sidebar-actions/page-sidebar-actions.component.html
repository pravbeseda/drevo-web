@if (isArticle()) {
    <app-sidebar-action
        [order]="10"
        icon="toc"
        label="Содержание"
        priority="secondary"
        testId="toc-action"
        (activated)="openTableOfContents()"
    />
}

@if (offeredEditUrl(); as url) {
    <app-sidebar-action
        [order]="30"
        icon="edit"
        label="Редактировать"
        priority="primary"
        [link]="url"
        testId="edit-action"
    />
}

@if (isArticle() && articleId(); as id) {
    @if (topics(); as t) {
        <app-topics-sidebar-action
            [articleId]="id"
            [topics]="t"
            (topicsChanged)="topicsChanged.emit($event)"
        />
    }
}

@if (version(); as v) {
    <app-moderation-sidebar-action
        [version]="v"
        [kind]="kind()"
        [priority]="moderationPriority()"
        [disabled]="moderationDisabled()"
        (moderated)="moderated.emit($event)"
    />
}
