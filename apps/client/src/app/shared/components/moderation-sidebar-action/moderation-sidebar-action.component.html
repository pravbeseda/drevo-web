@if (canModerate()) {
    <app-sidebar-action
        [order]="50"
        [icon]="moderationIcon()"
        label="Модерация"
        [priority]="priority()"
        [disabled]="disabled()"
        [badge]="validationCount()"
        testId="moderation-action"
        (activated)="openSheet()"
    />
}
