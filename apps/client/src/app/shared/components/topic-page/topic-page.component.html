@if (topic(); as topic) {
    <div
        #scroller
        class="topic-page__feed"
        data-testid="topic-feed"
        uiScrollbar
    >
        <div
            #messages
            class="topic-page__messages"
            data-testid="topic-messages"
        >
            @if (hasPrevious()) {
                <app-topic-feed-edge
                    end="previous"
                    [state]="previousState()"
                    (loadMore)="onLoadPrevious()"
                />
            }

            @for (item of feed(); track item.message.id) {
                @if (item.day; as day) {
                    <div class="topic-page__day">
                        <span
                            class="topic-page__pill"
                            data-testid="topic-day"
                        >
                            {{ day }}
                        </span>
                    </div>
                }
                <app-message-card
                    [message]="item.message"
                    [topicPath]="topicPath()"
                    [anchored]="item.message.id === anchorId()"
                    [own]="item.own"
                    [seriesStart]="item.seriesStart"
                    [seriesEnd]="item.seriesEnd"
                    [replyTo]="item.replyTo"
                    [parent]="item.parent"
                    (reply)="composer.replyTo(item.message)"
                    (quote)="composer.quote(item.message)"
                />
            }

            @if (hasNext()) {
                <app-topic-feed-edge
                    end="next"
                    [state]="nextState()"
                    (loadMore)="onLoadNext()"
                />
            }
        </div>
    </div>

    <app-forum-composer
        #composer
        class="topic-page__composer"
        data-testid="topic-composer"
        [topicId]="topic.id"
        (posted)="onPosted($event)"
    />
} @else if (isNotFound()) {
    <app-error
        title="Тема не найдена"
        message="Запрашиваемая тема не существует или была удалена."
        [showHomeButton]="true"
        data-testid="topic-not-found"
    />
} @else if (isLoadError()) {
    <app-error
        title="Ошибка загрузки"
        message="Не удалось загрузить тему. Попробуйте обновить страницу."
        [showHomeButton]="true"
        data-testid="topic-load-error"
    />
}
