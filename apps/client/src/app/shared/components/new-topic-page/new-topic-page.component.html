<div class="new-topic-page__row">
    @if (asksForSection()) {
        <span class="new-topic-page__label">Раздел</span>
        <ui-button-toggle-group
            ariaLabel="Раздел"
            appearance="segmented"
            data-testid="new-topic-section"
            name="section"
            [options]="sectionOptions()"
            [ngModel]="pickedSection()"
            (ngModelChange)="onSectionPicked($event)"
        />
    } @else {
        <span class="new-topic-page__label">К статье</span>
        <span
            class="new-topic-page__owner"
            data-testid="new-topic-owner"
        >
            {{ ownerTitle() }}
        </span>
    }
</div>

<div class="new-topic-page__row">
    <ui-inline-input
        class="new-topic-page__title"
        placeholder="Заголовок"
        data-testid="new-topic-title"
        [value]="title()"
        (valueChanged)="onTitleChanged($event)"
    />
    @if (errors().title; as error) {
        <span
            class="new-topic-page__error"
            data-testid="new-topic-title-error"
        >
            {{ error }}
        </span>
    }
</div>

<lib-editor
    class="new-topic-page__editor"
    data-testid="new-topic-text"
    [content]="text()"
    [showToolbar]="false"
    [frameless]="true"
    [customExtensions]="editorExtensions"
    (contentChanged)="onTextChanged($event)"
/>

@if (errors().text || errors().other) {
    <div class="new-topic-page__errors">
        @if (errors().text; as error) {
            <p
                class="new-topic-page__error"
                data-testid="new-topic-text-error"
            >
                {{ error }}
            </p>
        }
        @if (errors().other; as error) {
            <p
                class="new-topic-page__error"
                data-testid="new-topic-error"
            >
                {{ error }}
            </p>
        }
    </div>
}

<app-forum-send-bar
    class="new-topic-page__actions"
    data-testid="new-topic-actions"
    [disabled]="!canSubmit()"
    [loading]="sending()"
    (send)="submit()"
/>
