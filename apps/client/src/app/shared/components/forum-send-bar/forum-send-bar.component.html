<ui-icon-button
    icon="attach_file"
    label="Прикрепить"
    testId="forum-attach"
    [disabled]="true"
/>
<ng-content />
<span
    class="forum-send-bar__hint"
    data-testid="forum-send-hint"
>
    {{ sendKey }} — отправить
</span>
<ui-button
    variant="filled"
    accent="primary"
    testId="forum-send"
    [disabled]="disabled()"
    [loading]="loading()"
    (click)="send.emit()"
>
    Отправить
</ui-button>
