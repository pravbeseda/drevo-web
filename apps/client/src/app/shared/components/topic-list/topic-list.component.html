<ul class="topic-list">
    @for (topic of items(); track topic.id) {
        <li
            class="topic-list__item"
            data-testid="topic-item"
        >
            <a
                class="topic-list__link"
                ariaCurrentWhenActive="page"
                data-testid="topic-link"
                routerLinkActive
                [routerLink]="topicLink(topic.id)"
            >
                <span class="topic-list__line">
                    @if (topic.pinned) {
                        <ui-icon
                            class="topic-list__pin"
                            data-testid="topic-pinned"
                            name="push_pin"
                            size="small"
                            tooltip="Закреплённая тема"
                        />
                    }
                    <span
                        class="topic-list__title"
                        data-testid="topic-title"
                    >
                        {{ topic.title }}
                    </span>
                    @if (topic.lastPostAt) {
                        <span
                            class="topic-list__time"
                            data-testid="topic-last-post"
                            [attr.aria-label]="topic.lastPostAt | formatDate"
                        >
                            {{ topic.lastPostAt | shortDate }}
                        </span>
                    }
                </span>
                @if (topic.article; as article) {
                    <span
                        class="topic-list__meta"
                        data-testid="topic-article"
                    >
                        к статье {{ article.title }}
                    </span>
                }
                @if (topic.lastAuthor; as lastAuthor) {
                    <span
                        class="topic-list__author"
                        data-testid="topic-last-author"
                    >
                        {{ lastAuthor }}
                    </span>
                }
            </a>
        </li>
    }
</ul>
