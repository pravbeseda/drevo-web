@if (replyTarget(); as target) {
    <div
        class="forum-composer__reply"
        data-testid="composer-reply"
    >
        <span class="forum-composer__reply-body">
            <span
                class="forum-composer__reply-author"
                data-testid="composer-reply-author"
            >
                {{ target.author.name }}
            </span>
            <span
                class="forum-composer__reply-text"
                data-testid="composer-reply-text"
            >
                {{ replyExcerpt() }}
            </span>
        </span>
        <ui-icon-button
            icon="close"
            label="Не отвечать на это сообщение"
            testId="composer-reply-cancel"
            (clicked)="cancelReply()"
        />
    </div>
}

<lib-editor
    data-testid="composer-editor"
    [content]="draft()"
    [showToolbar]="false"
    [autoHeight]="true"
    [frameless]="true"
    [customExtensions]="editorExtensions"
    (contentChanged)="onDraftChanged($event)"
/>

@if (error(); as error) {
    <p
        class="forum-composer__error"
        data-testid="composer-error"
    >
        {{ error }}
    </p>
}
@if (pending()) {
    <p
        class="forum-composer__pending"
        data-testid="composer-pending"
    >
        Сообщение отправлено на модерацию и появится после проверки.
    </p>
}

<div
    class="forum-composer__actions"
    data-testid="composer-actions"
>
    <ui-button
        variant="text"
        testId="composer-attach"
        [disabled]="true"
    >
        <ui-icon
            name="attach_file"
            size="small"
        />
        Прикрепить
    </ui-button>
    <ui-button
        variant="filled"
        accent="primary"
        testId="composer-send"
        [disabled]="!canSend()"
        [loading]="sending()"
        (click)="send()"
    >
        Отправить
    </ui-button>
</div>
