@if (news(); as news) {
    <app-page-sidebar-actions
        kind="news"
        [version]="news"
        [editUrl]="editUrl()"
        (moderated)="onModerated($event)"
    />
    <div class="news-meta">
        @if (date(); as date) {
            <span data-testid="news-date">{{ date }}</span>
        }
        @for (section of sections(); track section.id) {
            <span data-testid="news-section">{{ section.title }}</span>
        }
    </div>
    <app-wiki-content
        data-testid="news-content"
        [content]="news.content"
    />
}
