@if (error()) {
    <app-error
        data-testid="news-error"
        title="Ошибка"
        [message]="error()"
    />
} @else if (news(); as news) {
    <app-sidebar-reserve />
    @if (canPickTopic()) {
        <app-news-topic-sidebar-action
            [topics]="topics()"
            [selected]="news.topics[0]"
            [busy]="isSavingTopic()"
            (picked)="saveTopic($event)"
        />
    }

    <article
        class="news"
        data-testid="news-page"
    >
        <ui-tabs-group [groups]="tabGroups()">
            <router-outlet />
        </ui-tabs-group>
    </article>
}
