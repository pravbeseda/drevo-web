@if (isNotFound()) {
    <app-error
        data-testid="article-not-found"
        title="Статья не найдена"
        message="Запрашиваемая статья не существует или была удалена."
        [showHomeButton]="true"
    />
} @else if (error()) {
    <app-error
        data-testid="article-error"
        title="Ошибка"
        [message]="error()"
    />
} @else if (article() || isMissing()) {
    <app-sidebar-reserve />

    <article
        class="article"
        data-testid="article-page"
    >
        <ui-tabs-group [groups]="tabGroups()">
            <router-outlet />
        </ui-tabs-group>
    </article>
}
