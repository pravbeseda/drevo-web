@if (withPanel()) {
    <app-sidebar-action
        priority="primary"
        icon="add"
        label="Новая тема"
        testId="forum-new-topic"
        [link]="newTopicLink()"
    />
}

<app-topic-panes
    [description]="sectionDescription()"
    [withPanel]="withPanel()"
>
    @if (hasTopicList()) {
        @if (pages.items().length === 0) {
            <p
                class="topics-page__empty"
                data-testid="topics-empty"
            >
                Тем пока нет.
            </p>
        } @else {
            <app-topic-list
                [items]="pages.items()"
                [total]="pages.total()"
                [loadState]="pages.loadState()"
                (loadMore)="pages.loadMore()"
                (retry)="pages.retry()"
            />
        }
    } @else if (isNotFound()) {
        <app-error
            title="Раздел не найден"
            message="Запрашиваемый раздел форума не существует."
            [showHomeButton]="true"
            data-testid="topics-not-found"
        />
    } @else if (isLoadError()) {
        <app-error
            title="Ошибка загрузки"
            message="Не удалось загрузить список тем. Попробуйте обновить страницу."
            [showHomeButton]="true"
            data-testid="topics-load-error"
        />
    }
</app-topic-panes>
