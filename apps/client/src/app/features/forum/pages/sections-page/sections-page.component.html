@if (sections(); as sections) {
    <ul class="sections">
        @for (section of sections; track section.id) {
            <li
                class="sections__item"
                data-testid="section-item"
            >
                <a
                    class="sections__name"
                    data-testid="section-link"
                    [routerLink]="['/forum', section.id]"
                >
                    {{ section.name }}
                </a>
                <p
                    class="sections__description"
                    data-testid="section-description"
                >
                    {{ section.description }}
                </p>
            </li>
        }
    </ul>
} @else if (isLoadError()) {
    <app-error
        title="Ошибка загрузки"
        message="Не удалось загрузить разделы форума. Попробуйте обновить страницу."
        [showHomeButton]="true"
        data-testid="sections-load-error"
    />
}
