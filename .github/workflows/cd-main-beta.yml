name: CD Main Beta

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - uses: nrwl/nx-set-shas@v5
              with:
                  main-branch-name: 'main'

            - name: Run affected tasks
              run: |
                  pnpm nx affected -t lint --parallel=3
                  pnpm nx affected -t test --parallel=3 --configuration=ci
                  pnpm nx affected -t e2e

            - name: Lint the Playwright suite
              run: pnpm lint:playwright

            - name: Check formatting
              run: pnpm format:check

            - name: Lint styles
              run: pnpm lint:styles

            - name: Type coverage
              run: pnpm lint:types

            - name: Type check the projects the build does not compile
              run: pnpm lint:typecheck

            - name: Per-file coverage floor
              run: pnpm lint:coverage

            - name: Tests for the gate scripts
              run: pnpm test:scripts

            - name: Release workflow invariants
              run: pnpm lint:workflows

            - name: Knip (unused files, exports and dependencies)
              run: pnpm knip

            - name: Build verification
              run: |
                  echo "Verifying build..."
                  pnpm exec nx build client --configuration=production
                  echo "Build successful"

            - name: SSR host allow-list
              run: pnpm lint:ssr-hosts

    deploy:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: ci
        runs-on: ubuntu-latest
        environment: beta

        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate version and build
              id: build
              env:
                  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
              run: |
                  VERSION=$(date +'%y%m%d-%H%M')
                  export VERSION
                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  echo "Building beta version: $VERSION"

                  # Replace Sentry DSN placeholder
                  if [ -n "$SENTRY_DSN" ]; then
                    echo "Configuring Sentry DSN..."
                    sed -i "s|__SENTRY_DSN_PLACEHOLDER__|$SENTRY_DSN|g" apps/client/src/environments/environment.prod.ts
                  else
                    echo "Warning: SENTRY_DSN secret is not set, Sentry will be disabled"
                    sed -i "s|__SENTRY_DSN_PLACEHOLDER__||g" apps/client/src/environments/environment.prod.ts
                  fi

                  # Verify the replacement (hide sensitive DSN)
                  echo "Environment file after replacement:"
                  if [ -n "$SENTRY_DSN" ]; then
                    # Use awk to avoid sed escaping issues with special characters in DSN URL
                    awk -v dsn="$SENTRY_DSN" '{gsub(dsn, "[SENTRY_DSN_HIDDEN]"); print}' apps/client/src/environments/environment.prod.ts
                  else
                    cat apps/client/src/environments/environment.prod.ts
                  fi

                  pnpm exec nx build client --configuration=production

            - name: SSR host allow-list
              run: pnpm lint:ssr-hosts

            - name: Upload source maps to Sentry
              env:
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
                  SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
                  VERSION: ${{ steps.build.outputs.version }}
              run: |
                  if [ -z "$SENTRY_AUTH_TOKEN" ]; then
                    echo "SENTRY_AUTH_TOKEN not set, skipping source map upload"
                    exit 0
                  fi

                  if [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
                    echo "SENTRY_ORG or SENTRY_PROJECT not set, skipping source map upload"
                    exit 0
                  fi

                  fail_step() {
                    echo "Source map upload failed: $1"
                    exit 1
                  }

                  echo "Uploading source maps to Sentry for release $VERSION..."

                  echo "Uploading source maps from ./dist/apps/client/browser..."
                  if ! pnpm exec sentry-cli sourcemaps upload \
                    --release="$VERSION" \
                    --url-prefix "~/" \
                    ./dist/apps/client/browser; then
                    fail_step "Sentry source map upload failed for version $VERSION"
                  fi

                  echo "Source maps uploaded for release $VERSION"

            - name: Deploy
              uses: ./.github/actions/deploy
              with:
                  environment: 'beta'
                  pm2-app-name: 'drevo-beta'
                  ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
                  ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
                  ssh-user: ${{ secrets.SSH_USER }}
                  ssh-host: ${{ secrets.SSH_HOST }}
                  ssh-port: ${{ secrets.SSH_PORT || '22' }}
                  source-path: 'dist/apps/client'
                  version: ${{ steps.build.outputs.version }}

            - name: Notify deployment
              if: always()
              env:
                  BETA_URL: ${{ vars.BETA_URL }}
              run: |
                  if [ "${{ job.status }}" == "success" ]; then
                    echo "Beta deployment successful"
                    echo "### ✅ Beta deployed" >> $GITHUB_STEP_SUMMARY
                    echo "**Version**: ${{ steps.build.outputs.version }}" >> $GITHUB_STEP_SUMMARY
                    if [ -n "$BETA_URL" ]; then
                      echo "**URL**: $BETA_URL" >> $GITHUB_STEP_SUMMARY
                    fi
                  else
                    echo "Beta deployment failed"
                    echo "### ❌ Beta deployment failed" >> $GITHUB_STEP_SUMMARY
                    exit 1
                  fi
