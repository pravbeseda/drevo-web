---
# Security updates already run without this file — it adds the scheduled version updates,
# which is what keeps a dependency current before a CVE forces the issue.
#
# `ignore` suppresses security updates as well as version updates, so nothing here ignores a
# dependency outright: every entry names `update-types: version-update:*`, which leaves the
# security channel open on the same package.
version: 2

updates:
    # Nobody bumps an action by hand, and a floating major tag never crosses to the next major
    # on its own. One grouped PR a month covers all thirteen.
    #
    # `/` reaches `.github/workflows` and an `action.yml` in the repository root — not a
    # composite action in a subdirectory, which is where the deploy action lives and pins
    # `shimataro/ssh-key-action`. Its directory is listed so that pin is watched too.
    - package-ecosystem: github-actions
      directories:
          - /
          - /.github/actions/deploy
      schedule:
          interval: monthly
      groups:
          github-actions:
              patterns:
                  - '*'
      commit-message:
          prefix: chore

    # `libs/shared/package.json` repeats the root ranges verbatim (`@nx/dependency-checks` is
    # an error when the two drift) and the root declares no workspaces, so nothing links them.
    # Both directories are listed, which puts a change to either manifest in the same grouped
    # PR instead of a root-only bump that lands red.
    - package-ecosystem: npm
      directories:
          - /
          - /libs/shared
      schedule:
          interval: monthly
      open-pull-requests-limit: 5
      # Touching the declared range only when the new version falls outside it keeps patches
      # and minors in yarn.lock, where there is nothing to drift from — the pair of manifests
      # only moves together on a major.
      versioning-strategy: increase-if-necessary
      commit-message:
          prefix: chore
          prefix-development: chore
      groups:
          # The three dependencies `libs/shared/package.json` declares alongside the root.
          # No `update-types`, so this group also takes a major — which is the only update
          # that rewrites a caret range, and therefore the only one that can put the two
          # manifests out of step. Without it a major falls outside every group here and
          # arrives as one pull request per directory, each red on `@nx/dependency-checks`.
          # Keep the list equal to the dependencies of `libs/shared/package.json`.
          shared-lib-dependencies:
              patterns:
                  - 'tslib'
                  - 'diff'
                  - 'diff-match-patch'
          # Two copies of @codemirror/state break the production build and nothing else —
          # the unit tests stay green. Moving the packages in one PR keeps them deduped.
          codemirror:
              patterns:
                  - '@codemirror/*'
          # Angular ships its packages in lockstep and refuses a mixed set at runtime. The
          # build toolchain is part of that set: `@angular-devkit/*` and `@schematics/angular`
          # carry the same version as the framework and match none of the `@angular/*` globs.
          angular:
              patterns:
                  - '@angular/*'
                  - '@angular-devkit/*'
                  - '@schematics/angular'
                  - '@angular-eslint/*'
                  - 'angular-eslint'
              update-types:
                  - patch
          nx:
              patterns:
                  - '@nx/*'
                  - 'nx'
              update-types:
                  - patch
          production-dependencies:
              dependency-type: production
              update-types:
                  - minor
                  - patch
          development-dependencies:
              dependency-type: development
              update-types:
                  - minor
                  - patch
      ignore:
          # A major or minor of Angular or Nx arrives with schematics that rewrite
          # source; `nx migrate` runs them and a version bump in package.json does not. Patch
          # releases carry no migration, so they stay in scope above.
          - dependency-name: '@angular/*'
            update-types:
                - version-update:semver-major
                - version-update:semver-minor
          - dependency-name: '@angular-devkit/*'
            update-types:
                - version-update:semver-major
                - version-update:semver-minor
          - dependency-name: '@schematics/angular'
            update-types:
                - version-update:semver-major
                - version-update:semver-minor
          - dependency-name: '@angular-eslint/*'
            update-types:
                - version-update:semver-major
                - version-update:semver-minor
          - dependency-name: 'angular-eslint'
            update-types:
                - version-update:semver-major
                - version-update:semver-minor
          - dependency-name: '@nx/*'
            update-types:
                - version-update:semver-major
                - version-update:semver-minor
          - dependency-name: 'nx'
            update-types:
                - version-update:semver-major
                - version-update:semver-minor
          # TypeScript is out of scope at every level, patches included: `resolutions` pins
          # `eslint-plugin-sonarjs/typescript` to the same version, and the note beside it
          # requires the two to move together. A bump that touched only devDependencies would
          # install a second compiler copy — which fails nothing and silently diverges the
          # type-aware lint results from the build.
          - dependency-name: 'typescript'
            update-types:
                - version-update:semver-major
                - version-update:semver-minor
                - version-update:semver-patch
