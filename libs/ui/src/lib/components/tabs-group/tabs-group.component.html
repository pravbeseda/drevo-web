<div class="tabs-group-container">
    @for (group of groups(); track $index) {
        <nav
            class="tab-group"
            [class.tab-group--end]="group.align === 'end'"
        >
            @for (tab of group.items; track tab.route) {
                <a
                    class="tab-link"
                    [routerLink]="tab.route"
                    routerLinkActive
                    #rla="routerLinkActive"
                    [routerLinkActiveOptions]="tab.exactRouteMatch ? exactPathMatch : prefixPathMatch"
                    [class.tab-link--active]="isCurrent(tab, rla.isActive)"
                    [attr.aria-current]="isCurrent(tab, rla.isActive) ? 'page' : null"
                    [attr.aria-label]="tab.label"
                    [attr.data-testid]="tab.testId ?? null"
                >
                    <ui-icon
                        class="tab-icon"
                        [name]="tab.icon"
                        [tooltip]="tab.label"
                        size="small"
                    />
                    <span class="tab-label">{{ tab.label }}</span>
                    @if (tab.badge !== undefined) {
                        <ui-badge [value]="tab.badge" />
                    }
                </a>
            }
        </nav>
    }
</div>
<div class="tabs-group-content">
    <ng-content />
</div>
